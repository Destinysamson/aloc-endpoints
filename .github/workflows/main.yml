name: Fetch and Validate JAMB Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract_data:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Extraction Script
        env:
          ALOC_TOKEN: ${{ secrets.ALOC_TOKEN }}
        run: |
          python <<'PY'
          import requests
          import json
          import os
          import time

          subjects = [
              'english',
              'chemistry',
              'physics',
              'biology',
              'lit-in-english',
              'government',
              'crs',
              'economics',
              'mathematics'
          ]

          years = range(2016, 2027)

          missing_data = {}

          headers = {
              "AccessToken": os.getenv("ALOC_TOKEN", "")
          }

          for subj in subjects:
              missing_data[subj] = []

              for year in years:
                  url = "https://questions.aloc.com.ng/api/v2/q"

                  params = {
                      "subject": subj,
                      "year": year,
                      "type": "utme"
                  }

                  try:
                      response = requests.get(
                          url,
                          headers=headers,
                          params=params,
                          timeout=20
                      )

                      if response.status_code != 200:
                          missing_data[subj].append({
                              "year": year,
                              "status": response.status_code
                          })

                      else:
                          result = response.json()

                          if not result.get("data"):
                              missing_data[subj].append(year)

                  except Exception as e:
                      missing_data[subj].append({
                          "year": year,
                          "error": str(e)
                      })

                  time.sleep(1)

          print("Missing Data Report:")
          print(json.dumps(missing_data, indent=2))

          with open("missing_report.json", "w") as f:
              json.dump(missing_data, f, indent=2)

          print("Report successfully generated!")
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add missing_report.json

          if ! git diff --cached --quiet; then
            git commit -m "Update missing data report"
            git push
          else
            echo "No changes detected."
          fi
