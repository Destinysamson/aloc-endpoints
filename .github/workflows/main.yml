name: JAMB Question Extraction 2016-2026

"on":
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  extract_jamb_data:
    name: Extract and Save JAMB Questions
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Extract JAMB Questions
        env:
          ALOC_TOKEN: ${{ secrets.ALOC_SECRET_TOKEN }}
        run: |
          python <<'PY'
          import requests
          import json
          import os
          import time
          from pathlib import Path

          TOKEN = os.getenv("ALOC_TOKEN")

          if not TOKEN:
              raise SystemExit(
                  "ERROR: ALOC_SECRET_TOKEN is missing from GitHub Secrets."
              )

          BASE_URL = "https://questions.aloc.com.ng/api/v2/m"

          SUBJECTS = [
              "english",
              "chemistry",
              "physics",
              "biology",
              "lit-in-english",
              "government",
              "crs",
              "economics",
              "mathematics"
          ]

          YEARS = range(2016, 2027)

          OUTPUT = Path("jamb_questions")
          OUTPUT.mkdir(exist_ok=True)

          headers = {
              "AccessToken": TOKEN,
              "Accept": "application/json"
          }

          report = {}
          total_questions = 0
          successful_requests = 0
          failed_requests = 0

          session = requests.Session()
          session.headers.update(headers)

          for subject in SUBJECTS:

              report[subject] = {}

              for year in YEARS:

                  print(f"\nFetching {subject.upper()} - {year}")

                  params = {
                      "subject": subject,
                      "year": year,
                      "type": "utme"
                  }

                  try:
                      response = session.get(
                          BASE_URL,
                          params=params,
                          timeout=30
                      )

                      if response.status_code != 200:
                          failed_requests += 1

                          report[subject][str(year)] = {
                              "status": "failed",
                              "http_status": response.status_code,
                              "message": response.text[:500]
                          }

                          print(
                              f"API ERROR: HTTP {response.status_code}"
                          )

                          time.sleep(1)
                          continue

                      result = response.json()

                      questions = result.get("data", [])

                      if isinstance(questions, dict):
                          questions = [questions]

                      if not isinstance(questions, list):
                          questions = []

                      if questions:

                          filename = f"{subject}_{year}.json"
                          filepath = OUTPUT / filename

                          with open(
                              filepath,
                              "w",
                              encoding="utf-8"
                          ) as file:

                              json.dump(
                                  questions,
                                  file,
                                  indent=2,
                                  ensure_ascii=False
                              )

                          count = len(questions)

                          total_questions += count
                          successful_requests += 1

                          report[subject][str(year)] = {
                              "status": "success",
                              "question_count": count,
                              "file": filename
                          }

                          print(
                              f"SUCCESS: Saved {count} questions"
                          )

                      else:

                          report[subject][str(year)] = {
                              "status": "no_data",
                              "question_count": 0
                          }

                          print("No questions returned.")

                          successful_requests += 1

                  except requests.exceptions.RequestException as error:

                      failed_requests += 1

                      report[subject][str(year)] = {
                          "status": "request_error",
                          "message": str(error)
                      }

                      print(f"REQUEST ERROR: {error}")

                  except (ValueError, KeyError) as error:

                      failed_requests += 1

                      report[subject][str(year)] = {
                          "status": "data_error",
                          "message": str(error)
                      }

                      print(f"DATA ERROR: {error}")

                  time.sleep(1)

          summary = {
              "project": "JAMB CBT Question Database",
              "years": list(YEARS),
              "subjects": SUBJECTS,
              "total_questions": total_questions,
              "successful_requests": successful_requests,
              "failed_requests": failed_requests,
              "results": report
          }

          with open(
              OUTPUT / "extraction_report.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  summary,
                  file,
                  indent=2,
                  ensure_ascii=False
              )

          print("\n================================")
          print("JAMB EXTRACTION FINISHED")
          print("================================")
          print("Total Questions:", total_questions)
          print("Successful Requests:", successful_requests)
          print("Failed Requests:", failed_requests)
          print("================================")

          PY

      - name: Upload Extracted Questions
        uses: actions/upload-artifact@v4
        with:
          name: JAMB-Questions-2016-2026
          path: jamb_questions/
          retention-days: 90
          if-no-files-found: error

      - name: Commit Extracted Questions
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add jamb_questions/

          if ! git diff --cached --quiet; then
            git commit -m "Update JAMB question database 2016-2026"
            git push
          else
            echo "No changes detected."
          fi
