name: Stalwart Prep - JAMB Question Extraction

on:
  workflow_dispatch:
    inputs:
      year_scope:
        description: "Select extraction years"
        required: true
        type: choice
        options:
          - priority
          - archive
        default: priority

  schedule:
    - cron: "30 1 * * 0"

permissions:
  contents: read

concurrency:
  group: stalwart-prep-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ALOC_API_KEY: ${{ secrets.ALOC_SECRET_TOKEN }}
      ALOC_BASE_URL: https://dev.aloc.com.ng/api/v1
      YEAR_SCOPE: ${{ inputs.year_scope || 'priority' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check API secret
        run: |
          if [ -z "$ALOC_API_KEY" ]; then
            echo "ERROR: ALOC_SECRET_TOKEN is missing."
            exit 1
          fi

      - name: Diagnose ALOC connection
        run: |
          python - <<'PY'
          import os
          import requests

          url = os.environ["ALOC_BASE_URL"] + "/subjects"

          try:
              response = requests.get(
                  url,
                  headers={
                      "X-API-Key": os.environ["ALOC_API_KEY"],
                      "Accept": "application/json"
                  },
                  timeout=30
              )

              print("HTTP STATUS:", response.status_code)
              print("RESPONSE:", response.text[:2000])

              if response.status_code != 200:
                  raise SystemExit("ALOC connection test failed.")

          except requests.RequestException as error:
              print("CONNECTION ERROR:", str(error))
              raise SystemExit(1)
          PY

      - name: Run JAMB extraction
        run: python scripts/extract_jamb.py

      - name: Upload extracted question database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stalwart-prep-jamb-${{ github.run_number }}
          path: |
            database/
            reports/
          if-no-files-found: warn
          retention-days: 30
