name: Stalwart Prep - JAMB Question Extraction

on:
  workflow_dispatch:
    inputs:
      year_scope:
        description: "Select years to extract"
        required: true
        type: choice
        options:
          - priority
          - archive
        default: priority

      max_subjects:
        description: "0 means all available subjects"
        required: false
        default: "0"

  schedule:
    - cron: "30 1 * * 0"

permissions:
  contents: read

concurrency:
  group: stalwart-prep-jamb-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ALOC_API_KEY: ${{ secrets.ALOC_SECRET_KEY }}
      ALOC_BASE_URL: https://dev.aloc.com.ng/api/v1
      YEAR_SCOPE: ${{ inputs.year_scope || 'priority' }}
      MAX_SUBJECTS: ${{ inputs.max_subjects || '0' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check API secret
        run: |
          if [ -z "$ALOC_API_KEY" ]; then
            echo "ALOC_SECRET_KEY is missing."
            exit 1
          fi

      - name: Run JAMB extraction
        run: python scripts/extract_jamb.py

      - name: Upload actual question database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stalwart-prep-jamb-${{ github.run_number }}
          path: |
            database/
            reports/
          if-no-files-found: error
          retention-days: 30
