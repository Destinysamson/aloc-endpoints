name: JAMB Historical Questions Extraction

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Extraction stage"
        required: true
        default: "priority"
        type: choice
        options:
          - priority
          - 2010-2014
          - 2000-2009
          - all

      refresh:
        description: "Redownload previously extracted data"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ALOC_TOKEN: ${{ secrets.ALOC_SECRET_TOKEN }}
      STAGE: ${{ inputs.stage }}
      REFRESH: ${{ inputs.refresh }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Extract JAMB questions
        run: |
          mkdir -p scripts
          cat > scripts/extract.py <<'PY'
          import os
          import json
          import time
          import requests
          from pathlib import Path

          BASE = "https://dev.aloc.com.ng/api/v1"

          TOKEN = os.environ["ALOC_TOKEN"]

          HEADERS = {
              "X-API-Key": TOKEN,
              "Accept": "application/json"
          }

          SUBJECTS = [
              "english-language",
              "mathematics",
              "chemistry",
              "physics",
              "biology",
              "literature-in-english",
              "government",
              "christian-religious-studies",
              "economics"
          ]

          STAGES = {
              "priority": range(2015, 2027),
              "2010-2014": range(2010, 2015),
              "2000-2009": range(2000, 2010),
              "all": range(2000, 2027)
          }

          YEARS = STAGES[os.getenv("STAGE", "priority")]
          REFRESH = os.getenv("REFRESH", "false").lower() == "true"

          ROOT = Path("data/jamb")
          ROOT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update(HEADERS)

          report = {
              "stage": os.getenv("STAGE"),
              "successful": [],
              "empty": [],
              "failed": [],
              "total_questions": 0
          }

          def request_json(url, params=None):

              for attempt in range(6):

                  response = session.get(
                      url,
                      params=params,
                      timeout=60
                  )

                  if response.status_code == 429:
                      wait = int(
                          response.headers.get("Retry-After", 10)
                      )
                      time.sleep(max(wait, 5))
                      continue

                  if response.status_code >= 500:
                      time.sleep(5 * (attempt + 1))
                      continue

                  if response.status_code == 404:
                      return None

                  response.raise_for_status()

                  return response.json()

              raise RuntimeError("Maximum retries exceeded")

          def discover_years(subject):

              url = f"{BASE}/subjects/{subject}/years"

              result = request_json(url)

              if result is None:
                  return []

              available = []

              for item in result.get("data", []):

                  year = item.get("year")

                  breakdown = item.get("breakdown", {})

                  jamb_count = breakdown.get("jamb", 0)

                  exam_types = item.get("examTypes", [])

                  if (
                      year in YEARS
                      and (
                          jamb_count > 0
                          or "jamb" in exam_types
                      )
                  ):
                      available.append(year)

              return sorted(set(available))

          def extract_subject(subject):

              print(f"\nDISCOVERING: {subject}")

              years = discover_years(subject)

              print(f"Available years: {years}")

              for year in years:

                  folder = ROOT / subject
                  folder.mkdir(parents=True, exist_ok=True)

                  output = folder / f"{year}.json"

                  if output.exists() and not REFRESH:

                      print(f"SKIPPING existing: {subject} {year}")

                      continue

                  print(f"EXTRACTING: {subject} {year}")

                  questions = []
                  seen = set()
                  cursor = None
                  page_count = 0

                  try:

                      while True:

                          params = {
                              "subject": subject,
                              "examType": "jamb",
                              "year": year,
                              "country": "NG",
                              "contentSource": "historical",
                              "limit": 15
                          }

                          if cursor:
                              params["cursor"] = cursor

                          result = request_json(
                              f"{BASE}/questions",
                              params
                          )

                          if result is None:
                              break

                          data = result.get("data", [])

                          for question in data:

                              if question.get("id") not in seen:

                                  questions.append(question)

                                  seen.add(question.get("id"))

                          pagination = result.get("pagination", {})

                          next_cursor = pagination.get("nextCursor")

                          has_more = pagination.get("hasMore", False)

                          page_count += 1

                          if not has_more or not next_cursor:
                              break

                          if next_cursor == cursor:
                              raise RuntimeError(
                                  "Pagination cursor did not change"
                              )

                          cursor = next_cursor

                          time.sleep(2.2)

                          if page_count >= 500:
                              raise RuntimeError("Page safety limit reached")

                      dataset = {
                          "exam": "JAMB",
                          "subject": subject,
                          "year": year,
                          "source": "ALOC",
                          "contentSource": "historical",
                          "questionCount": len(questions),
                          "questions": questions
                      }

                      with open(output, "w", encoding="utf-8") as f:

                          json.dump(
                              dataset,
                              f,
                              ensure_ascii=False,
                              indent=2
                          )

                      if questions:

                          report["successful"].append({
                              "subject": subject,
                              "year": year,
                              "questions": len(questions),
                              "pages": page_count
                          })

                      else:

                          report["empty"].append({
                              "subject": subject,
                              "year": year
                          })

                      report["total_questions"] += len(questions)

                      print(
                          f"SAVED {len(questions)} QUESTIONS"
                      )

                  except Exception as error:

                      print("ERROR:", error)

                      report["failed"].append({
                          "subject": subject,
                          "year": year,
                          "error": str(error)
                      })

                      continue

          for subject in SUBJECTS:

              try:
                  extract_subject(subject)

              except Exception as error:

                  print(f"SUBJECT DISCOVERY FAILED: {subject}: {error}")

                  report["failed"].append({
                      "subject": subject,
                      "error": str(error)
                  })

          with open(
              ROOT / "extraction-report.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(report, f, indent=2)

          print("\n========== EXTRACTION REPORT ==========")

          print(json.dumps(report, indent=2))

          if report["failed"]:
              raise SystemExit(
                  "Extraction finished with failures. "
                  "Check extraction-report.json."
              )

          PY

          python scripts/extract.py

      - name: Commit extracted questions
        if: always()
        run: |
          git config user.name "JAMB CBT Bot"
          git config user.email "actions@github.com"

          git add data/jamb/

          if ! git diff --cached --quiet; then
            git commit -m "Extract authentic JAMB historical questions"
            git push
          else
            echo "No new data to commit."
          fi

      - name: Upload extraction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JAMB-Extraction-Report
          path: data/jamb/extraction-report.json
          if-no-files-found: ignore
